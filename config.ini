[logging]
# WARNING retains actionable field diagnostics without routine health summaries.
# INFO adds per-camera health state; DEBUG adds capture-pipeline details.
level = WARNING
file = ./logs/camera_dashboard.log
max_bytes = 5242880
backup_count = 3
stdout = true

[performance]
dynamic_fps = true
perf_check_interval_ms = 2000
min_dynamic_fps = 10
min_dynamic_ui_fps = 12
ui_fps_step = 2
cpu_load_threshold = 0.75
cpu_temp_threshold_c = 75.0
stress_hold_count = 3
recover_hold_count = 3
stale_frame_timeout_sec = 1.5
restart_cooldown_sec = 5.0
max_restarts_per_window = 3
restart_window_sec = 30.0
# Restart a capture worker if its first frame misses this deadline.
first_frame_timeout_sec = 10.0

[camera]
rescan_interval_ms = 15000
failed_camera_cooldown_sec = 30.0
slot_count = 3
kill_device_holders = true
# Prefer the low-latency GStreamer MJPEG path, with automatic V4L2 fallback.
use_gstreamer = true

[profile]
# Capture settings determine camera/decoder load; 320x240 and 640x480 are the
# practical monitoring resolutions on a Pi. Higher resolutions should be
# validated with every configured camera active.
capture_width = 640
capture_height = 480
capture_fps = 25
# UI FPS sets a target paint cadence with render-overhead compensation and also
# bounds worker emissions; it does not change the open camera's device rate.
ui_fps = 20

[health]
log_interval_sec = 60

[slots]
# Pin tiles to physical USB ports using the stable "usb-0:1.3" tail of the
# /dev/v4l/by-path name; omit the hardware-specific "platform-..." prefix.
# Matching respects whole port components, so "1.1" cannot claim "1.10",
# "1.1.2", or "2.1.1". Without by-path discovery, use "index:N" for
# /dev/videoN. Slots whose pinned camera is missing stay reserved; unpinned
# by-path cameras fill unreserved slots in USB port path order, followed by
# numeric fallbacks in video-index order.
#slot0 = usb-0:1.1
#slot1 = usb-0:1.2
#slot2 = usb-0:1.3
